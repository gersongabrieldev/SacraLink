name: Release

# Gera o instalador SacraLink-Setup-x64.exe e publica a release da tag.
# Disparo: tag vX.Y.Z (ex.: git tag v0.1.0 && git push origin v0.1.0) ou manual
# (o disparo manual só gera o artefato, sem publicar).
# Notas da versão: docs/releases/vX.Y.Z.md (obrigatório para tags).
# Versões 0.x ou com sufixo (ex.: 1.0.0-rc.1) saem como pré-lançamento.
#
# Assinatura de código (SignPath Foundation, docs/installation/assinatura.md):
# fica ativa quando o repositório tem a variável SIGNPATH_ORGANIZATION_ID e o
# segredo SIGNPATH_API_TOKEN (opcionais: SIGNPATH_PROJECT_SLUG, padrão
# "SacraLink", e SIGNPATH_SIGNING_POLICY_SLUG, padrão "release-signing").
# São três rodadas, cada uma aprovada pelo mantenedor na SignPath:
#   1. executáveis (painel, servidor, .com e MediaMTX);
#   2. partes internas do instalador (programa temporário e desinstalador),
#      que o Inno Setup só assina durante a compilação: compila-se uma vez para
#      separá-las e de novo, idêntico, usando as cópias assinadas;
#   3. o instalador final.
# Sem essa configuração, a release sai sem assinatura. O mesmo fluxo é testado
# a cada envio no ci.yml com um certificado descartável.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 0.1.0)"
        required: true

permissions:
  contents: write
  actions: read # a SignPath baixa os artefatos enviados para assinar

env:
  GO_VERSION: "1.27.x"

jobs:
  installer:
    name: Instalador Windows
    runs-on: windows-latest
    env:
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Versão
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT
          $pre = if ($v.Contains("-") -or $v.StartsWith("0.")) { "true" } else { "false" }
          "prerelease=$pre" >> $env:GITHUB_OUTPUT
          $notes = "docs/releases/v$v.md"
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and -not (Test-Path $notes)) { throw "Faltam as notas da versão em $notes" }
          "notes=$notes" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $v · assinatura SignPath: $env:SIGNPATH"
      - name: Build
        shell: pwsh
        # MediaMTX compilado do código-fonte (versão e commit fixados) para poder ser assinado.
        run: ./scripts/build-windows.ps1 -Version "${{ steps.ver.outputs.version }}" -MediaMTXFromSource
      - name: WebView2 Runtime (bootstrapper oficial da Microsoft)
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile dist-release/MicrosoftEdgeWebview2Setup.exe
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # --- Sem assinatura (SignPath ainda não configurada) ------------------
      - name: Instalador (sem assinatura)
        if: env.SIGNPATH != 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase compile -Version "${{ steps.ver.outputs.version }}"

      # --- Assinatura 1/3: executáveis ---------------------------------------
      - name: "Assinatura 1/3: separar executáveis"
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase stage-binaries -Dir signing/1
      - name: "Assinatura 1/3: enviar"
        id: up1
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: assinar-1-executaveis
          path: signing/1/*
          retention-days: 1
      - name: "Assinatura 1/3: SignPath (aprovar no painel da SignPath)"
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SacraLink' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.up1.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/1-assinado
      - name: "Assinatura 1/3: aplicar"
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase apply-binaries -Dir signing/1-assinado

      # --- Assinatura 2/3: partes internas do instalador ---------------------
      - name: "Assinatura 2/3: compilar e separar as partes internas"
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase compile -Mode collect -Dir signing/2 -Version "${{ steps.ver.outputs.version }}"
      - name: "Assinatura 2/3: enviar"
        id: up2
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: assinar-2-instalador-interno
          path: signing/2/*.exe
          retention-days: 1
      - name: "Assinatura 2/3: SignPath (aprovar no painel da SignPath)"
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SacraLink' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.up2.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/2-assinado
      - name: "Assinatura 2/3: recompilar com as partes assinadas"
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase compile -Mode replay -Dir signing/2-assinado -Version "${{ steps.ver.outputs.version }}"

      # --- Assinatura 3/3: instalador final ----------------------------------
      - name: "Assinatura 3/3: separar o instalador"
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase stage-setup -Dir signing/3
      - name: "Assinatura 3/3: enviar"
        id: up3
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: assinar-3-instalador
          path: signing/3/*
          retention-days: 1
      - name: "Assinatura 3/3: SignPath (aprovar no painel da SignPath)"
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SacraLink' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.up3.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/3-assinado
      - name: "Assinatura 3/3: aplicar e conferir"
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Phase apply-setup -Dir signing/3-assinado
          ./scripts/build-installer.ps1 -Phase verify -RequireTrusted

      # --- Publicação --------------------------------------------------------
      - name: SHA256SUMS.txt
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Phase checksums
      - name: Notas da release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $n = Get-Content "${{ steps.ver.outputs.notes }}" -Raw -Encoding utf8
          # Atribuição exigida pela SignPath Foundation nas releases assinadas.
          if ($env:SIGNPATH -eq "true") { $n += "`n---`n`nFree code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).`n" }
          [IO.File]::WriteAllText("$PWD/release-notes.md", $n)
      - uses: actions/upload-artifact@v4
        with:
          name: SacraLink-Setup-x64-${{ steps.ver.outputs.version }}
          path: |
            installer/windows/Output/SacraLink-Setup-x64.exe
            installer/windows/Output/SHA256SUMS.txt
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SacraLink ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            installer/windows/Output/SacraLink-Setup-x64.exe
            installer/windows/Output/SHA256SUMS.txt
